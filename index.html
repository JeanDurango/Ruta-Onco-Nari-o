<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ruta Oncológica · Nariño</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./css/styles.css" />
</head>
<body>

  <div id="loading-screen" class="loading-state">Cargando Ruta Oncológica...</div>

  <!-- Pantalla de respaldo: solo se usa si ZOHO.CRM.CONFIG.getCurrentUser() no
       logra identificar al usuario del portal automáticamente. Ver README,
       seccion 3. -->
  <div id="identify-screen" class="identify-wrap" hidden>
    <div class="identify-card">
      <div class="brand-lockup">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M12 3c3 3 6 6.5 6 10.5A6 6 0 1 1 6 13.5C6 9.5 9 6 12 3z" fill="#7078c8"/><circle cx="12" cy="13.2" r="2.1" fill="#fff"/></svg>
        <span style="font-size:15px;font-weight:700;">cielum<span style="font-weight:400;color:var(--brand-600);"> health</span></span>
      </div>
      <h1>No pudimos identificar tu usuario</h1>
      <p id="identify-explain">
        No se pudo confirmar automáticamente tu usuario del portal. Mientras se
        confirma esa integración, elige tu correo de la lista para continuar
        (esto es temporal y no reemplaza la autenticación del portal).
      </p>
      <p id="identify-error" class="field-error" hidden></p>
      <div class="field">
        <label for="identify-select">Tu correo</label>
        <select id="identify-select"></select>
      </div>
      <button id="identify-continue-btn" class="btn btn-primary btn-block" type="button" style="margin-top:14px;">Continuar</button>
    </div>
  </div>

  <div id="app-shell" hidden>
    <div id="sidebar"></div>

    <div id="main">
      <div id="topbar">
        <div class="topbar-search" id="topbar-search-wrap">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="global-search" placeholder="Buscar paciente, caso o municipio..." />
        </div>

        <div class="spacer"></div>

        <div class="bell-wrap" id="bell-wrap">
          <button id="bell-btn" class="bell-btn" type="button" title="Notificaciones">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
            <span class="bell-label">Notificaciones</span>
            <span id="bell-dot" class="bell-dot" hidden></span>
          </button>
          <div id="notif-dropdown" class="notif-dropdown" hidden></div>
        </div>
        <div class="topbar-divider" id="topbar-divider-1"></div>
        <div class="bell-wrap" id="user-wrap">
          <button id="topbar-user-btn" class="topbar-user" type="button">
            <span id="user-avatar" class="avatar-circle">--</span>
            <span class="who">
              <span id="user-name" class="name">-</span>
              <span id="user-role-label" class="role">-</span>
            </span>
          </button>
          <!-- Solo se llena/usa en modo local (fuera del Client Portal de
               Zoho) para cambiar de rol de demo sin recargar la pantalla
               completa de identificacion. Ver iniciarModoLocal en app.js. -->
          <div id="role-switch-dropdown" class="notif-dropdown" hidden></div>
        </div>
      </div>

      <div id="setup-banner" hidden></div>

      <div id="content"></div>

      <div id="bottom-nav"></div>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast"></div>

  <script src="https://live.zwidgets.com/js-sdk/1.5/ZohoEmbededAppSDK.min.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
